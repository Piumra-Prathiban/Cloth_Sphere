<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Cloth Sphere</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="container">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="menu-toggle" id="menuToggle">
                <i class="fas fa-times"></i>
            </button>
            <h2>Inventory Management</h2>
        </div>
        <ul class="nav-list">
            <li><a href="/inventoryDashboard" class="nav-item"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
            <li><a href="/fabrics" class="nav-item"><i class="fas fa-layer-group"></i><span>Fabrics</span></a></li>
            <li><a href="/garments" class="nav-item"><i class="fas fa-boxes"></i><span>Garments</span></a></li>
            <li><a href="/reports" class="nav-item"><i class="fas fa-file-alt"></i><span>Stock Reports</span></a></li>
            <li><a href="/user/profile" class="nav-item active"><i class="fas fa-user"></i><span>Edit Profile</span></a></li>
            <li><a href="/communication/internal" class="nav-item"><i class="fas fa-comments"></i><span>Internal Communication</span></a></li>
            <li><a href="/logout" class="nav-item logout-btn"><i class="fas fa-sign-out-alt"></i><span>Log Out</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fas fa-bars"></i>
            </button>
            <h2 class="page-title"><i class="fas fa-user-circle"></i> My Profile</h2>
        </div>

        <div class="welcome-text">
            Manage your personal information and security settings.
        </div>

        <div class="profile-sections">
            <!-- Personal Profile Section -->
            <div class="profile-card">
                <div class="card-header">
                    <h3><i class="fas fa-user"></i> Personal Information</h3>
                </div>
                <form id="profileForm" class="profile-form" action="/user/update" method="post">
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user-tag"></i> User Name</label>
                        <input type="text"
                               id="username"
                               name="username"
                               th:value="${currentUser?.userName}"
                               readonly
                               class="readonly-field">
                    </div>

                    <div class="form-group">
                        <label for="role"><i class="fas fa-id-badge"></i> Role</label>
                        <input type="text"
                               id="role"
                               name="role"
                               th:value="${currentUser?.role}"
                               readonly
                               class="readonly-field">
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email"
                               id="email"
                               name="email"
                               th:value="${currentUser?.email}"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel"
                               id="phoneNumber"
                               name="phoneNumber"
                               th:value="${currentUser?.phoneNumber}"
                               required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-update">
                            <i class="fas fa-save"></i> Update Profile
                        </button>
                    </div>
                </form>
            </div>

            <!-- Change Password Section -->
            <div class="profile-card">
                <div class="card-header">
                    <h3><i class="fas fa-lock"></i> Change Password</h3>
                </div>
                <form id="passwordForm" class="profile-form" action="/user/updatePassword" method="post">
                    <div class="form-group">
                        <label for="currentPassword"><i class="fas fa-key"></i> Current Password</label>
                        <div class="password-input">
                            <input type="password" id="currentPassword" name="currentPassword" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('currentPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                        <div class="password-input">
                            <input type="password" id="newPassword" name="newPassword" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <small class="form-help"><i class="fas fa-info-circle"></i> Password must be at least 8 characters long</small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-check-circle"></i> Confirm New Password</label>
                        <div class="password-input">
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-update">
                            <i class="fas fa-key"></i> Change Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<!-- Hidden field to pass update message from server -->
<input type="hidden" id="updateMessage" th:value="${session.updateMessage}">

<script src="/js/profileim.js"></script>

</body>
</html>
