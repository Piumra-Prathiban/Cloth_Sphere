<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buyer Dashboard</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dashboard-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 450px;
        }
        .dashboard-card h2 {
            color: #333;
            font-weight: bold;
        }
        .dashboard-card p {
            margin-top: 15px;
            color: #666;
        }
        .btn-custom {
            margin: 10px;
            border-radius: 30px;
            padding: 10px 25px;
            background: #6a11cb;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            border: none;
            transition: 0.3s;
        }
        .btn-custom:hover {
            opacity: 0.85;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="dashboard-card">
    <h2>Welcome, <span th:text="${buyerName}">Buyer</span> 🎉</h2>
    <p>Great to see you back! Use the options below to explore.</p>

    <div>
        <a href="/products" class="btn btn-custom">🛍️ Browse Products</a>
        <a href="/orders/my" class="btn btn-custom">📦 My Orders</a>
        <a href="/inquiries/my" class="btn btn-custom">💬 My Inquiries</a>
        <a href="/profile" class="btn btn-custom">👤 Profile</a>
        <a href="/logout" class="btn btn-danger" style="border-radius:30px;">🚪 Logout</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
