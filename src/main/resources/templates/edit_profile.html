<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow p-4">
    <h2 class="mb-4 text-center">✏️ Edit Profile</h2>

    <form th:action="@{/profile/edit}" th:object="${buyer}" method="post">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" th:field="*{name}" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" th:field="*{email}" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="text" class="form-control" id="password" th:field="*{password}" required>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>

  </div>
</div>
</body>
</html>
