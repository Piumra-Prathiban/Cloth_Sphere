<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Order - ClothSphere</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .section-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Create New Sales Order</h1>
        <a href="/sales-orders/list" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Back to List
        </a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form action="/sales-orders/create" method="post">
        <div class="row">
            <div class="col-lg-8">
                <div class="card form-card mb-4">
                    <div class="card-body">
                        <!-- Buyer Information -->
                        <div class="section-header">
                            <h5 class="mb-0"><i class="fas fa-user"></i> Buyer Information</h5>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="buyerName" class="form-label">Buyer Name *</label>
                                <input type="text" class="form-control" id="buyerName" name="buyerName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="buyerEmail" class="form-label">Email Address *</label>
                                <input type="email" class="form-control" id="buyerEmail" name="buyerEmail" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="buyerPhone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="buyerPhone" name="buyerPhone">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="buyerAddress" class="form-label">Delivery Address</label>
                                <textarea class="form-control" id="buyerAddress" name="buyerAddress" rows="1"></textarea>
                            </div>
                        </div>

                        <!-- Product Information -->
                        <div class="section-header mt-4">
                            <h5 class="mb-0"><i class="fas fa-box"></i> Product Information</h5>
                        </div>

                        <div class="mb-3">
                            <label for="productDetails" class="form-label">Product Details *</label>
                            <textarea class="form-control" id="productDetails" name="productDetails" rows="3" required placeholder="Describe the product details, specifications, colors, sizes, etc."></textarea>
                        </div>

                        <!-- Pricing and Quantity -->
                        <div class="section-header">
                            <h5 class="mb-0"><i class="fas fa-calculator"></i> Pricing & Quantity</h5>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="quantity" class="form-label">Quantity *</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" min="1" required onchange="calculateTotal()">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="unitPrice" class="form-label">Unit Price *</label>
                                <input type="number" class="form-control" id="unitPrice" name="unitPrice" step="0.01" min="0" required onchange="calculateTotal()">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Total Amount</label>
                                <div class="form-control-plaintext fw-bold text-primary" id="totalAmount">$0.00</div>
                            </div>
                        </div>

                        <!-- Delivery Information -->
                        <div class="section-header">
                            <h5 class="mb-0"><i class="fas fa-truck"></i> Delivery Information</h5>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="deliveryDeadline" class="form-label">Delivery Deadline *</label>
                                <input type="date" class="form-control" id="deliveryDeadline" name="deliveryDeadline" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="notes" class="form-label">Additional Notes</label>
                                <textarea class="form-control" id="notes" name="notes" rows="1"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Summary Panel -->
            <div class="col-lg-4">
                <div class="card form-card position-sticky" style="top: 20px;">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-receipt"></i> Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Quantity:</span>
                                <strong id="summaryQuantity">0 units</strong>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Unit Price:</span>
                                <strong id="summaryUnitPrice">$0.00</strong>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="h6">Total Amount:</span>
                                <strong class="h6 text-primary" id="summaryTotal">$0.00</strong>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Create Order
                            </button>
                            <a href="/sales-orders/list" class="btn btn-outline-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
    function calculateTotal() {
        const quantity = parseFloat(document.getElementById('quantity').value) || 0;
        const unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
        const total = quantity * unitPrice;

        document.getElementById('totalAmount').textContent = '$' + total.toFixed(2);
        document.getElementById('summaryQuantity').textContent = quantity + ' units';
        document.getElementById('summaryUnitPrice').textContent = '$' + unitPrice.toFixed(2);
        document.getElementById('summaryTotal').textContent = '$' + total.toFixed(2);
    }

    // Set minimum date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('deliveryDeadline').min = tomorrow.toISOString().split('T')[0];
</script>
</body>
</html>
