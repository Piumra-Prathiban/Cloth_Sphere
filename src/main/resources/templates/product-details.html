<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product Details</title>
    <style>
        body { font-family: Arial; background: #fdf6f9; color: #333; padding: 50px; }
        .product-details { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        img { width: 100%; height: 400px; object-fit: cover; border-radius: 10px; }
        h1 { color: #ff4d94; margin-top: 20px; }
        p { font-size: 1rem; color: #555; margin-top: 10px; }
        .price { font-weight: bold; color: #333; margin-top: 15px; font-size: 1.2rem; }
    </style>
</head>
<body>
<div class="product-details">
    <img th:src="${product.imageUrl}" alt="Product Image"/>
    <h1 th:text="${product.name}">Product Name</h1>
    <p th:text="${product.description}">Product Description</p>
    <p class="price" th:text="'$' + ${product.price}">Price</p>
    <a href="/buyer/products" style="text-decoration:none; color:#ff4d94;">&larr; Back to Catalog</a>
</div>
</body>
</html>
