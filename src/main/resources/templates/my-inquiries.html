<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Inquiries - ClothSphere</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }

        .btn-new {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .btn-new:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-OPEN { background: #ffc107; color: white; }
        .status-IN_PROGRESS { background: #17a2b8; color: white; }
        .status-RESOLVED { background: #28a745; color: white; }
        .status-CLOSED { background: #6c757d; color: white; }

        .btn-view {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-view:hover {
            color: #764ba2;
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-back:hover {
            color: #764ba2;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>💬 My Inquiries</h2>

    <a href="/inquiries/new" class="btn-new">+ New Inquiry</a>

    <div th:if="${inquiries.isEmpty()}" class="empty-state">
        <p>You haven't submitted any inquiries yet.</p>
        <p>Click "New Inquiry" above to get started!</p>
    </div>

    <table th:if="${!inquiries.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Created</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inquiry : ${inquiries}">
            <td th:text="${inquiry.id}">1</td>
            <td th:text="${inquiry.inquiryType}">PRODUCT</td>
            <td th:text="${inquiry.subject}">Subject</td>
            <td>
                <span th:class="'status-badge status-' + ${inquiry.status}" th:text="${inquiry.status}">OPEN</span>
            </td>
            <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">2025-10-01</td>
            <td>
                <a th:href="@{/inquiries/{id}(id=${inquiry.id})}" class="btn-view">View Details</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/buyer/dashboard" class="btn-back">⬅ Back to Dashboard</a>
</div>
</body>
</html>
