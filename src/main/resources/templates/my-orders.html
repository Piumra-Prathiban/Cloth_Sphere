<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders - ClothSphere</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #6a11cb;
      color: white;
    }

    tr:hover {
      background-color: #f2f2f2;
    }

    .btn-back {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: #2575fc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-back:hover {
      background: #6a11cb;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>📦 My Orders</h2>

  <table>
    <thead>
    <tr>
      <th>#</th>
      <th>Product</th>
      <th>Fabric Type</th>
      <th>Quantity</th>
      <th>Status</th>
      <th>Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
      <td th:text="${order.id}">1</td>
      <td th:text="${order.product.name}">T-Shirt</td>
      <td th:text="${order.product.fabricType}">Cotton</td>
      <td th:text="${order.quantity}">2</td>
      <td th:text="${order.status}">Pending</td>
      <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2025-10-01</td>
    </tr>
    </tbody>
  </table>

  <div style="text-align: center;">
    <a th:href="@{/dashboard}" class="btn-back">⬅ Back to Dashboard</a>
  </div>
</div>
</body>
</html>
