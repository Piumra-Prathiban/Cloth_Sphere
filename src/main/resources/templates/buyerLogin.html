<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png">
    <title>ClothSphere - Buyer Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            color: white;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: #ff4d94;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #ff4d94;
            border-bottom: 3px solid #ff4d94;
        }

        .tab:hover {
            color: rgba(255, 77, 148, 0.8);
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .required {
            color: #ff4d94;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #ff4d94;
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #ff4d94;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #ff66a3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 148, 0.4);
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff4d94;
            color: #ff4d94;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #f44336;
            color: #ffcdd2;
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4caf50;
            color: #c8e6c9;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 2rem;
            }

            .form-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="logo">CLOTHSPHERE</h1>
            <p class="tagline">Buyer Portal - Shop the Latest Fashion</p>
        </div>

        <div class="form-container">
            <!-- Error/Success Messages -->
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${param.logout}" class="alert alert-success">You have been logged out successfully.</div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('login')">Login</button>
                <button class="tab" onclick="showTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="login" class="form-content active">
                <form action="/buyer/login" method="post">
                    <div class="form-group">
                        <label for="login-username">Username <span class="required">*</span></label>
                        <input type="text" id="login-username" name="username" placeholder="Enter your username" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password <span class="required">*</span></label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register" class="form-content">
                <form action="/buyer/register" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="reg-username">Username <span class="required">*</span></label>
                            <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-email">Email <span class="required">*</span></label>
                            <input type="email" id="reg-email" name="email" placeholder="your.email@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-customer-name">Full Name <span class="required">*</span></label>
                        <input type="text" id="reg-customer-name" name="customerName" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="reg-password">Password <span class="required">*</span></label>
                            <input type="password" id="reg-password" name="password" placeholder="Create a password" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
                            <input type="password" id="reg-confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="reg-phone">Phone Number</label>
                            <input type="text" id="reg-phone" name="phone" placeholder="Enter your phone number">
                        </div>

                        <div class="form-group">
                            <label for="reg-company">Company</label>
                            <input type="text" id="reg-company" name="company" placeholder="Your company name (optional)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-address">Address</label>
                        <textarea id="reg-address" name="address" placeholder="Enter your address (optional)"></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Register</button>
                </form>
            </div>

            <a href="/getstart" class="back-btn">← Back to Get Started</a>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            // Hide all form contents
            const contents = document.querySelectorAll('.form-content');
            contents.forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected content and activate tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
