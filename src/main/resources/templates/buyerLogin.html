<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon-32x32.png">
    <title>ClothSphere - Buyer Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue-gray: #5A738A;
            --secondary-darker: #425A6C;
            --background-cream: #F7F5EC;
            --accent-yellow: #EBD372;
            --white: #FFFFFF;
            --light-gray: #F5F5F5;
            --border-light: #E5E3DA;
        }

        body {
            font-family: 'Segoe UI', 'Open Sans', sans-serif;
            background: linear-gradient(180deg, var(--background-cream) 0%, #E8E6DD 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--secondary-darker);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--primary-blue-gray);
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 16px;
            color: var(--secondary-darker);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .form-container {
            background: var(--white);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(90, 115, 138, 0.1);
        }

        .tabs {
            display: flex;
            margin-bottom: 35px;
            border-bottom: 2px solid var(--border-light);
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--primary-blue-gray);
            font-size: 15px;
            letter-spacing: 1px;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab.active {
            color: var(--secondary-darker);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary-blue-gray);
        }

        .tab:hover {
            color: var(--secondary-darker);
        }

        .form-content {
            display: none;
        }

        .form-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary-blue-gray);
            font-weight: 500;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .required {
            color: var(--accent-yellow);
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-light);
            background: var(--white);
            border-radius: 4px;
            color: var(--secondary-darker);
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', 'Open Sans', sans-serif;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-blue-gray);
            background: var(--light-gray);
        }

        input::placeholder,
        textarea::placeholder {
            color: #A0A0A0;
            font-weight: 300;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-blue-gray);
            color: var(--white);
            border: none;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--secondary-darker);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(90, 115, 138, 0.3);
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            color: var(--primary-blue-gray);
            text-decoration: none;
            border: 2px solid var(--border-light);
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .back-btn:hover {
            background: var(--light-gray);
            border-color: var(--primary-blue-gray);
            color: var(--secondary-darker);
        }

        .alert {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .alert-error {
            background: #FFF3F3;
            border: 1px solid #FFD6D6;
            color: #D32F2F;
        }

        .alert-success {
            background: #F1F8F4;
            border: 1px solid #C8E6C9;
            color: #2E7D32;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Decorative element */
        .form-container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--accent-yellow);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 28px;
            }

            .form-container {
                padding: 30px 25px;
            }

            .tagline {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
            }

            .form-container {
                padding: 25px 20px;
            }

            .logo {
                font-size: 24px;
                letter-spacing: 2px;
            }

            label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="logo">CLOTH SPHERE</h1>
        <p class="tagline">Buyer Portal - Shop the Latest Fashion</p>
    </div>

    <div class="form-container">
        <!-- Error/Success Messages -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out successfully.</div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('login')">Login</button>
            <button class="tab" onclick="showTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login" class="form-content active">
            <form action="/buyer/login" method="post">
                <div class="form-group">
                    <label for="login-username">Username <span class="required">*</span></label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password <span class="required">*</span></label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register" class="form-content">
            <form action="/buyer/register" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-username">Username <span class="required">*</span></label>
                        <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email <span class="required">*</span></label>
                        <input type="email" id="reg-email" name="email" placeholder="your.email@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-customer-name">Full Name <span class="required">*</span></label>
                    <input type="text" id="reg-customer-name" name="customerName" placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-password">Password <span class="required">*</span></label>
                        <input type="password" id="reg-password" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
                        <input type="password" id="reg-confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="text" id="reg-phone" name="phone" placeholder="Enter your phone number">
                    </div>

                    <div class="form-group">
                        <label for="reg-company">Company</label>
                        <input type="text" id="reg-company" name="company" placeholder="Your company name (optional)">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-address">Address</label>
                    <textarea id="reg-address" name="address" placeholder="Enter your address (optional)"></textarea>
                </div>

                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>

        <a href="/getstart" class="back-btn">← Back to Get Started</a>
    </div>
</div>

<script>
    function showTab(tabName) {
        // Hide all form contents
        const contents = document.querySelectorAll('.form-content');
        contents.forEach(content => {
            content.classList.remove('active');
        });

        // Remove active class from all tabs
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.classList.remove('active');
        });

        // Show selected content and activate tab
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }
</script>
</body>
</html>
