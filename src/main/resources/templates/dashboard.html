<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buyer Dashboard</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .dashboard-container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 500px;
        }

        .dashboard-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .dashboard-container p {
            color: #666;
            margin-bottom: 30px;
        }

        .dashboard-btn {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 12px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            transition: transform 0.2s, opacity 0.2s;
        }

        .dashboard-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .logout-btn {
            background: #ff4d4d;
        }

        .logout-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <h2>Welcome, <span th:text="${buyerName}">Buyer</span> 🎉</h2>
    <p>Explore our products and manage your orders easily.</p>

    <button class="dashboard-btn" onclick="location.href='/products'">🛍️ View Products</button>
    <button class="dashboard-btn" onclick="location.href='/orders'">📦 My Orders</button>
    <button class="dashboard-btn" onclick="location.href='/profile'">👤 Profile</button>
    <button class="dashboard-btn logout-btn" onclick="location.href='/logout'">🚪 Logout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
